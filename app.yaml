kind: wasmer.io/App.v0
name: wordpress-website
package: wasmer/wordpress
volumes:
  - name: wp-content
    mount: /app/wp-content
scaling:
  mode: single_concurrency
capabilities:
  database:
    engine: mysql
instaboot:
  max_age: 59m
  requests:
    - path: /
      headers:
        - name: Accept
          value: text/html
        - name: Accept-Language
          value: en-US
